<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIG-IN · Coca-Cola On-Trade Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0c0e10; --panel:#14171a; --panel-2:#191d21; --panel-3:#20262b;
  --line:#262b30; --line-2:#333a41;
  --ink:#eef1f2; --ink-dim:#aab2b8; --ink-faint:#6c757d;
  --accent:#e8ff4f; --accent-deep:#c8df2e; --accent-ink:#0c0e10;
  --coke:#f5001d; --coke-2:#ff5563; --coke-deep:#b30d18;
  --live:#46e08f; --avail:#4fd6ff; --road:#586470;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace}
em{font-style:italic}
b{font-weight:700}

/* ============ HEADER ============ */
.app{position:sticky;top:0;z-index:50;background:rgba(12,14,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.app-in{display:flex;align-items:center;gap:20px;max-width:1300px;margin:0 auto;padding:13px 30px}
.brand{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.15em;font-size:16px;color:var(--ink)}
.brand span{color:var(--accent)}
.appctx{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding-left:18px;border-left:1px solid var(--line-2);line-height:1.4}
.appctx b{color:var(--ink-dim);font-weight:500}
.spacer{flex:1}

/* market selector */
.msel{position:relative}
.msel-btn{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:8px 13px;cursor:pointer;transition:border-color .15s}
.msel-btn:hover{border-color:var(--ink-faint)}
.msel-btn .mflag{font-size:17px}
.msel-btn .mnm{font-size:13.5px;font-weight:600}
.msel-btn .mst{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.msel-btn .mst.live{color:var(--live)} .msel-btn .mst.active{color:var(--avail)} .msel-btn .mst.road{color:var(--ink-faint)}
.stdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.stdot.live{background:var(--live)} .stdot.active{background:var(--avail)} .stdot.road{background:var(--road)}
.msel-btn .chev{margin-left:2px;color:var(--ink-faint);font-size:10px}
.msel-panel{position:absolute;top:calc(100% + 8px);right:0;width:330px;max-height:74vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;box-shadow:0 22px 60px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-6px);transition:all .16s;padding:7px}
.msel.open .msel-panel{opacity:1;visibility:visible;transform:none}
.grp{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:12px 11px 6px;display:flex;justify-content:space-between}
.mopt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:9px 11px;cursor:pointer;transition:background .12s}
.mopt:hover{background:var(--panel-2)} .mopt.sel{background:var(--panel-3)}
.mopt.rec{box-shadow:inset 2px 0 0 var(--coke)}
.mopt .flag{font-size:17px} .mopt .nm{flex:1;font-size:13.5px;font-weight:500}
.mopt .nm small{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-faint);font-weight:400;margin-top:1px;text-transform:none;letter-spacing:0}
.mopt .poi{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);text-align:right;line-height:1.2}

/* language toggle */
.lang{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.lang button{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;padding:8px 11px;background:var(--panel);color:var(--ink-faint);border:none;cursor:pointer;transition:all .13s}
.lang button.on{background:var(--accent);color:var(--accent-ink)}

/* ============ TABS ============ */
.tabsbar{position:sticky;top:57px;z-index:40;background:rgba(12,14,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs{display:flex;max-width:1300px;margin:0 auto;padding:0 22px}
.tab{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);background:none;border:none;border-bottom:2px solid transparent;padding:14px 15px;cursor:pointer;white-space:nowrap;transition:color .14s}
.tab:hover{color:var(--ink-dim)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .tnum{font-size:10px;color:var(--accent);opacity:.85}
.tab.on .tnum{opacity:1}

/* ============ LAYOUT ============ */
main{max-width:1300px;margin:0 auto}
.view{display:none} .view.on{display:block}
.section{padding:44px 30px 60px}
@media(max-width:640px){.section{padding:32px 20px 48px}}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.big{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(30px,4.6vw,52px);line-height:1.02;letter-spacing:-.02em;max-width:19ch}
.big em{color:var(--accent)}
.lead{font-size:16px;color:var(--ink-dim);max-width:66ch;margin-top:18px;line-height:1.6}
.demo-flag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line-2);border-radius:20px;padding:5px 12px;white-space:nowrap;flex-shrink:0}

.blockhead{margin:42px 0 5px;display:flex;align-items:baseline;gap:13px}
.blockhead .num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--accent)}
.blockhead h3{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:-.01em}
.blocksub{color:var(--ink-faint);font-size:13.5px;margin-bottom:20px;max-width:74ch;line-height:1.55}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:28px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);padding:18px 20px}
.kpi .k{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.kpi .v{font-family:'JetBrains Mono',monospace;font-size:27px;font-weight:700;line-height:1;margin:9px 0 6px}
.kpi .v.coke{color:var(--coke-2)}
.kpi .d{font-size:11.5px;color:var(--ink-dim);line-height:1.4}
.up{color:var(--live)} .dn{color:var(--coke-2)}

/* preview / layer cards */
.previewgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
@media(max-width:820px){.previewgrid{grid-template-columns:1fr 1fr}}
.pvcell{background:var(--panel);padding:20px}
.pvcell .pi{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)}
.pvcell .ph{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:9px 0 7px}
.pvcell .pp{font-size:12.5px;color:var(--ink-dim);line-height:1.5}

/* zone table */
.ztable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.ztable{width:100%;border-collapse:collapse;min-width:640px}
.ztable th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:14px 18px;background:var(--panel-2);font-weight:500;white-space:nowrap}
.ztable th.num,.ztable td.num{text-align:right}
.ztable td{padding:14px 18px;border-top:1px solid var(--line);font-size:13.5px}
.ztable tr:hover td{background:var(--panel-2)}
.zn{font-weight:600} .zb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-left:5px}
.mini{display:inline-block;width:52px;height:5px;background:var(--panel-3);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}
.minif{display:block;height:100%;background:var(--coke);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.cc{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.delta{font-family:'JetBrains Mono',monospace;font-size:12px}
.delta.up{color:var(--live)} .delta.dn{color:var(--coke-2)} .delta.flat{color:var(--ink-faint)}

/* share of menu */
.somrow{margin-top:8px}
.somtop{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px}
.somtop b{color:var(--coke-2)}
.somstack{display:flex;height:52px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.somseg{height:100%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1);overflow:hidden;min-width:0}
.somseg:not(.ccep){color:var(--accent-ink)}
.somleg{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:14px}
.somleg span{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.note{font-size:13.5px;color:var(--ink-dim);line-height:1.6;margin-top:18px;background:var(--panel);border-left:2px solid var(--coke);border-radius:0 6px 6px 0;padding:15px 18px}
.note b{color:var(--ink)}

/* brand table */
.btable{width:100%;border-collapse:collapse;margin-top:6px}
.btable th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500}
.btable th.num,.btable td.num{text-align:right}
.btable td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.rank{font-family:'JetBrains Mono',monospace;color:var(--ink-faint);font-size:12px;width:34px}
.bname{font-weight:500}
.owntag{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.05em;background:rgba(245,0,29,.14);color:var(--coke-2);border:1px solid rgba(245,0,29,.32);border-radius:3px;padding:2px 5px;margin-left:8px}
.pbar-track{display:inline-block;width:72px;height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:10px}
.pbar-fill{display:block;height:100%;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.catbtns{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 4px}
.catbtn{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:7px 13px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-dim);cursor:pointer;border-radius:6px;transition:all .13s}
.catbtn:hover:not(:disabled){border-color:var(--ink-faint)}
.catbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.catbtn:disabled{opacity:.34;cursor:not-allowed}

/* adjacency */
.adjrow{display:grid;grid-template-columns:190px 1fr 44px;align-items:center;gap:14px;padding:8px 0}
@media(max-width:640px){.adjrow{grid-template-columns:120px 1fr 38px}}
.adjrow .name{font-size:13px}
.idxtrack{position:relative;height:22px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.idxbase{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.idxfill{position:absolute;left:50%;top:0;bottom:0;background:linear-gradient(90deg,var(--coke-deep),var(--coke));border-radius:0 4px 4px 0;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.idxfill.under{left:auto;right:50%;border-radius:4px 0 0 4px;background:linear-gradient(90deg,#586470,#3a4046)}
.idxval{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);text-align:right}
.rivalrow{display:grid;grid-template-columns:190px 1fr 44px;align-items:center;gap:14px;padding:6px 0}
@media(max-width:640px){.rivalrow{grid-template-columns:120px 1fr 38px}}
.rtrack{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.rfill{display:block;height:100%;background:linear-gradient(90deg,#3a4046,#586470);width:0;transition:width .7s}
.rpct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);text-align:right}

/* placement */
.placement-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.placement-head .pt{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.plegend{display:flex;gap:16px}
.plegend span{font-size:11.5px;color:var(--ink-dim);display:flex;align-items:center;gap:7px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:820px){.pgrid{grid-template-columns:1fr}}
.pzone-name{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:13px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.matrow{display:grid;grid-template-columns:1fr;gap:5px;margin-bottom:13px}
.mname{font-size:12.5px;color:var(--ink-dim)}
.matbar{display:flex;align-items:center;gap:9px}
.mt{flex:1;height:9px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.mf{display:block;height:100%;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.mf.lead{background:linear-gradient(90deg,var(--coke-deep),var(--coke))}
.mf.chal{background:#586470}
.mv{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);width:26px;text-align:right}

/* exec gap */
.execline{display:grid;grid-template-columns:210px 1fr 70px;align-items:center;gap:14px;padding:9px 0}
@media(max-width:640px){.execline{grid-template-columns:130px 1fr 56px}}
.execline .en{font-size:13px}
.etr{position:relative;height:24px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.elist{position:absolute;left:0;top:0;bottom:0;background:rgba(245,0,29,.18);width:0;transition:width .7s}
.edeep{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--coke-deep),var(--coke));width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.eg{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);text-align:right}
.eg b{color:var(--coke-2)}
.exec-note{font-size:12.5px;color:var(--ink-faint);line-height:1.55;margin-top:14px;grid-column:1/-1}

/* price */
.price-block{display:flex;flex-direction:column;gap:24px;margin-top:6px}
.pricehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.pricehead .cat{font-size:14px;font-weight:600}
.pricehead .idx{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-dim)}
.pricehead .idx b{color:var(--ink)}
.pricesplit{display:flex;height:30px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.pricesplit div{width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pricelabels{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:7px}
.clusterwrap{position:relative;height:280px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.cpt{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px}
.cd{width:12px;height:12px;border-radius:50%;background:var(--coke);box-shadow:0 0 0 4px rgba(245,0,29,.18)}
.cl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);white-space:nowrap}
.clusaxis{position:absolute;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase}

/* insights */
.verdict{display:flex;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:22px 24px;margin-top:6px}
@media(max-width:640px){.verdict{flex-direction:column;align-items:flex-start;gap:14px}}
.vscore{text-align:center;flex-shrink:0}
.vn{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;color:var(--accent);line-height:1}
.vl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;max-width:100px}
.vtext{font-size:14.5px;color:var(--ink-dim);line-height:1.6}
.vtext b{color:var(--ink)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:820px){.panels{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:20px 22px}
.panel h4{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h4 .tag{font-size:9px;color:var(--ink-faint);text-transform:none;letter-spacing:0}
.ins-list{display:flex;flex-direction:column;gap:12px}
.irow{display:flex;gap:11px;align-items:flex-start}
.ic{width:8px;height:8px;border-radius:2px;margin-top:6px;flex-shrink:0}
.ic.win{background:var(--live)} .ic.lose{background:var(--coke)}
.itx{font-size:13px;color:var(--ink-dim);line-height:1.5}
.itx b{color:var(--ink)}
.wsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media(max-width:820px){.wsgrid{grid-template-columns:1fr}}
.wscell{background:var(--panel);padding:20px}
.wt{font-size:15px;font-weight:600;margin-bottom:8px}
.wtag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.wtag.grow{background:rgba(70,224,143,.13);color:var(--live)}
.wtag.def{background:rgba(232,255,79,.12);color:var(--accent)}
.wnote{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-top:10px}

/* banners + CTA */
.banner{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;border-radius:8px;padding:20px 24px}
.banner.pilot{background:linear-gradient(120deg,rgba(79,214,255,.09),transparent);border:1px solid rgba(79,214,255,.28)}
.banner.road{background:var(--panel);border:1px solid var(--line-2)}
.bh{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
.bs{font-size:13px;color:var(--ink-dim);margin-top:4px}
.cta{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:7px;border:none;cursor:pointer;white-space:nowrap;transition:all .14s}
.cta.primary{background:var(--accent);color:var(--accent-ink)}
.cta.primary:hover{background:var(--accent-deep)}
.cta.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line-2)}

/* data points */
.dpchips{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:26px}
@media(max-width:820px){.dpchips{flex-wrap:wrap}}
.dpchip{background:var(--panel);padding:18px 20px;flex:1;min-width:145px}
.dpchip .dcn{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:700;line-height:1}
.dpchip .dcl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-top:8px}
.dpchip.on-menu .dcn{color:var(--coke-2)}
.dpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}

/* ===== DIG-IN · Coca-Cola on-trade read =====
   Real coverage & venue universe from the DIG-IN European HoReCa sizing.
   Portugal = live. Spain + Germany already in our data. GB read in Soho.
   Rest of CCEP Europe = roadmap. Share/execution/price figures are
   illustrative; venue counts, splits and confidence are from the model.
   Narrative carried in EN + PT. Replace figures with production reads
   before this is shown outside CCEP. ===== */

const CCEP_OWNED=["Coca-Cola","Coca-Cola Zero","Fanta","Sprite","Fuze Tea","Nestea","Aquarius","Powerade","Monster","Burn","Appletiser","Royal Bliss","Nordic Mist","Mezzo Mix"];
const RED=["#f5001d","#ff5563","#b30d18","#ff8a94","#7d0912","#d10c1a"];

const T=new Proxy({},{get:(_,k)=>DICT[LANG][k]});
const tt=x=>(x&&typeof x==="object"&&("en" in x))?x[LANG]:x;

/* ================= HELPERS ================= */
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, LANG==="pt"?".":","); }
function fmtK(n){ if(n==null)return"—"; if(n>=1e6)return (n/1e6).toFixed(1).replace(".0","")+"M"; if(n>=1e4)return Math.round(n/1e3)+"K"; if(n>=1e3)return (n/1e3).toFixed(1).replace(".0","")+"K"; return String(n); }
function density(m){ return Math.round(Math.max(170, Math.min(680, m.per1000*52))); }
function colourMap(list,m){ let r=0,c=0; return list.map(([n])=> isCCEP(n,m)?RED[r++%RED.length]:COOL[c++%COOL.length]); }
function paint(root){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ (root||document).querySelectorAll("[data-w]").forEach(e=>{ e.style.width=e.getAttribute("data-w"); }); })); }
const cur=()=>MARKETS[MK];
const stLabel=m=> m.status==="live"?T.st_live : m.status==="active"?(m.inDB?T.st_indb:T.st_pilot) : T.st_road;

/* ================= SEEDED DOTS (pilot map) ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const _r=mulberry32(20260828); const DOTS=[]; for(let i=0;i<150;i++){ DOTS.push({x:24+_r()*592, y:20+_r()*320}); }
function hexPts(cx,cy,r){ let p=[]; for(let i=0;i<6;i++){ let a=Math.PI/180*(60*i-90); p.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); } return p; }
function inPoly(px,py,pts){ let inside=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ let xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1]; if(((yi>py)!=(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside; } return inside; }

/* ================= LANG / DROPDOWN / SELECTOR ================= */
function applyLang(l){ LANG=l; document.documentElement.lang=l;
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  $("appctx").innerHTML=T.appctx; $("footMeta").innerHTML=T.footMeta;
  document.querySelectorAll(".tlabel").forEach(e=>e.textContent=T[e.dataset.k]);
  updateSelBtn(); buildDropdown(); renderActive();
}
function updateSelBtn(){ const m=cur(); $("mselFlag").textContent=m.flag; $("mselName").textContent=m.name;
  $("mselStatus").className="mst "+m.status; $("mselStatus").innerHTML=`<span class="stdot ${m.status}"></span>`+stLabel(m); }
function buildDropdown(){
  const groups=[ ["live", T.grp_live, c=>MARKETS[c].status==="live"],
    ["indb", T.grp_indb, c=>MARKETS[c].inDB&&MARKETS[c].status!=="live"],
    ["pilot", T.grp_pilot, c=>MARKETS[c].pilotScan],
    ["road", T.grp_road, c=>MARKETS[c].status==="road"] ];
  let h="";
  groups.forEach(([key,label,test])=>{ const list=MARKET_ORDER.filter(test); if(!list.length)return;
    h+=`<div class="grp"><span>${label}</span><span>${list.length}</span></div>`;
    list.forEach(c=>{ const m=MARKETS[c]; const sub = m.status==="live"?`${fmtK(m.mapped)} ${T.mapped_lbl}`:(m.pilotScan?T.sub_pilot:(m.inDB?T.sub_indb:T.sub_road));
      h+=`<button class="mopt ${c===MK?"sel":""} ${m.recommended?"rec":""}" onclick="setMarket('${c}')"><span class="flag">${m.flag}</span><span class="nm">${m.name}<small>${sub}</small></span><span class="poi">${fmtK(m.poi)}<br><span style="font-size:8.5px;color:var(--ink-faint)">${T.venues_word}</span></span></button>`; });
  });
  $("mpanel").innerHTML=h;
}
function setMarket(c){ MK=c; const cc=MARKETS[c].cats; if(cc&&!cc.includes(CAT))CAT=cc[0]; updateSelBtn(); buildDropdown(); $("msel").classList.remove("open"); renderActive(); }

/* ================= TABS ================= */
function goTab(t){ TAB=t; document.querySelectorAll(".view").forEach(v=>v.classList.remove("on")); $("tab-"+t).classList.add("on");
  document.querySelectorAll("#tabs .tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); renderActive();
  try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){} }
function setCat(c){ CAT=c; renderActive(); }

function renderActive(){
  const m=cur();
  if(TAB==="overview") renderOverview(m);
  else if(TAB==="menu") gate(m,"menuWrap",renderMenu);
  else if(TAB==="adjacency") gate(m,"adjWrap",renderAdjacency);
  else if(TAB==="execution") gate(m,"execWrap",renderExecution);
  else if(TAB==="price") gate(m,"priceWrap",renderPrice);
  else if(TAB==="datapoints") renderDatapoints();
  else if(TAB==="coverage") renderCoverage();
  else if(TAB==="pilot") renderPilot();
}
function gate(m,wrapId,fn){
  if(m.status==="road"){ $(wrapId).innerHTML=`<div class="locked"><div class="lk">◗</div><h3>${m.flag} ${m.name} · ${T.locked_h}</h3><p>${T.locked_p}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="cta primary" onclick="goTab('coverage')">${T.cta_coverage}</button><button class="cta ghost" onclick="goTab('pilot')">${T.cta_pilot}</button></div></div>`; return; }
  fn(m); paint($(wrapId));
}

/* ================= SHARED PIECES ================= */
function hero(kicker,titleHTML,lead,flag){
  return `<div class="headrow"><div><div class="kicker">${kicker}</div><h1 class="big">${titleHTML}</h1></div>${flag?`<span class="demo-flag">${T.flag_illustrative}</span>`:""}</div><p class="lead">${lead}</p>`;
}
function kpiStrip(m){
  const q=m.kpi.qoq, qs=(q>0?"+":"")+q.toFixed(1);
  return `<div class="kpis">
    <div class="kpi"><div class="k">${T.kpi_portfolio}</div><div class="v coke">${m.kpi.ccep}%</div><div class="d">${T.owned_lbl}</div></div>
    <div class="kpi"><div class="k">${T.kpi_flagship}</div><div class="v">${m.kpi.ccFlag}%</div><div class="d">${T.kpi_flagship_d}</div></div>
    <div class="kpi"><div class="k">${T.kpi_zones}</div><div class="v">${fmt(m.deepVenues)}</div><div class="d">${T.kpi_zones_d}</div></div>
    <div class="kpi"><div class="k">${T.kpi_universe}</div><div class="v">${fmtK(m.poi)}</div><div class="d">${T.kpi_universe_d}</div></div>
    <div class="kpi"><div class="k">${T.kpi_qoq}</div><div class="v ${q>=0?"up":"dn"}">${qs}</div><div class="d">pts</div></div>
  </div>`;
}
function layerCards(){
  const map=[["menu",T.layer_menu,T.lc_menu_p],["adj",T.layer_adj,T.lc_adj_p],["exec",T.layer_exec,T.lc_exec_p],["price",T.layer_price,T.lc_price_p]];
  const n=k=>DP_LAYERS.find(l=>l.k===k).n;
  return `<div class="previewgrid">${map.map(([k,h,p])=>`<div class="pvcell"><div class="pi">${n(k)} data points</div><div class="ph">${h}</div><div class="pp">${p}</div></div>`).join("")}</div>`;
}
function zoneTable(m){
  return `<div class="ztable-wrap"><table class="ztable"><thead><tr><th>${T.zt_zone}</th><th class="num">${T.zt_venues}</th><th>${T.zt_share}</th><th class="num">${T.zt_qoq}</th><th>${T.zt_rival}</th><th class="num">${T.zt_price}</th><th class="num">${T.zt_premium}</th></tr></thead><tbody>${m.zones.map(z=>{
    const d=z.delta, dc=d>0?"up":d<0?"dn":"flat", ds=(d>0?"+":"")+d;
    return `<tr><td><span class="zn">${z.name}</span><span class="zb">${z.area}</span></td><td class="num">${fmt(z.venues)}</td><td><span class="mini"><span class="minif" data-w="${z.ccShare}%"></span></span><span class="cc">${z.ccShare}%</span></td><td class="num"><span class="delta ${dc}">${ds}</span></td><td>${z.rival.name} ${z.rival.share}%</td><td class="num">${z.priceIdx}</td><td class="num">${z.premium}%</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

/* ================= OVERVIEW ================= */
function renderOverview(m){
  let h="";
  if(m.status==="live"){
    h+=hero(T.ov_kicker_live, T.ov_h1, T.ov_lead, true);
    h+=kpiStrip(m);
    h+=`<div class="blockhead"><span class="num">01</span><h3>${T.lc_title}</h3></div>`+layerCards();
    h+=`<div class="blockhead"><span class="num">02</span><h3>${T.zt_title}</h3></div>`+zoneTable(m);
    const I=m.insights;
    h+=`<div class="blockhead"><span class="num">03</span><h3>${T.ins_title}</h3></div>`;
    h+=`<div class="verdict"><div class="vscore"><div class="vn">${I.score}</div><div class="vl">${tt(I.label)}</div></div><div class="vtext">${tt(I.verdict)}</div></div>`;

/* ================= ADJACENCIES ================= */
function renderAdjacency(m){
  const a=m.adjacency, maxDev=Math.max(...a.cuisines.map(c=>Math.abs(c[1]-100)));
  let h=hero(`${m.flag} ${m.name}`, T.tab_adjacency, T.adj_lead, true);
  h+=`<div class="blockhead"><span class="num">01</span><h3>${T.adj_cui_title} · ${a.brand}</h3></div><div class="blocksub">${T.adj_idxnote}</div>`;
  h+=a.cuisines.map(([lab,idx])=>{ const over=idx>=100, w=Math.round(Math.abs(idx-100)/maxDev*50);
    return `<div class="adjrow"><div class="name">${tt(lab)}</div><div class="idxtrack"><div class="idxbase"></div><div class="idxfill ${over?"":"under"}" data-w="${w}%"></div></div><div class="idxval">${idx}</div></div>`;
  }).join("");
  const mxr=Math.max(...a.rivals.map(r=>r[1]));
  h+=`<div class="blockhead"><span class="num">02</span><h3>${T.adj_riv_title}</h3></div>`;
  h+=a.rivals.map(([n,p])=>`<div class="rivalrow"><div class="name">${n}</div><div class="rtrack"><div class="rfill" data-w="${Math.round(p/mxr*100)}%"></div></div><div class="rpct">${p}%</div></div>`).join("");
  h+=`<div class="note">${tt(a.read)}</div>`;
  $("adjWrap").innerHTML=h;
}

/* ================= REQUEST A PILOT (WIZARD) ================= */
function wizSteps(){
  const s=[[1,T.ws1,T.ws1s],[2,T.ws2,T.ws2s],[3,T.ws3,T.ws3s]];
  const cur = wizStep==="sent"?4:wizStep;
  return `<div class="wizsteps">${s.map(([n,l,sub])=>`<div class="wizstep ${n===cur?"on":n<cur?"done":""}"><div class="wn">${n<cur?"✓":n}</div><div class="wl">${l}<small>${sub}</small></div></div>`).join("")}</div>`;
}
function wizVenuesEstimate(){ return Math.round(density(MARKETS[wizCountry])*0.16); }

function renderPilot(){
  const wrap=$("pilotWrap");
  if(wizStep==="submitting"){
    wrap.innerHTML=hero(T.pl_kicker,T.pl_h,T.pl_lead,false)+`<div class="wizsent"><div class="tick" style="background:rgba(232,255,79,.14);border-color:rgba(232,255,79,.4);color:var(--accent)">…</div><h3>${LANG==="en"?"Sending your request…":"A enviar o teu pedido…"}</h3></div>`;
    return;
  }
  if(wizStep==="sent"){
    const ref=wizSentRef||("DIG-"+wizCountry+"-"+(1000+Math.floor(_r()*8999)));
    wrap.innerHTML=hero(T.pl_kicker,T.pl_h,T.pl_lead,false)+`<div class="wizsent"><div class="tick">✓</div><h3>${T.sent_h}</h3><p>${T.sent_p}</p><div class="ref">${T.sent_ref}: ${ref}</div><div style="margin-top:24px"><button class="btn ghost" onclick="wizReset()">${T.sent_again}</button></div></div>`;

  }

    const m=MARKETS[wizCountry];

    h+=`<div class="btnrow"><span></span><button class="btn primary" id="wizNext" ${wizPin?"":"disabled"} onclick="wizGo(2)">${wizPin?T.wiz_next1:T.rd_pending}</button></div>`;
  } else if(wizStep===2){
    const byLayer={};DATAPOINTS.cats.forEach((c,i)=>{(byLayer[c.k]=byLayer[c.k]||[]).push(i);});
    const layerLbl={menu:T.layer_menu,exec:T.layer_exec,adj:T.layer_adj,price:T.layer_price,found:T.layer_found};
    let total=0; wizSel.forEach(i=>total+=DATAPOINTS.cats[i].n);

    ["menu","exec","adj","price","found"].forEach(k=>{ const idxs=byLayer[k]; const sub=idxs.reduce((a,i)=>a+(wizSel.has(i)?DATAPOINTS.cats[i].n:0),0);
      h+=`<div class="checkgroup"><div class="checkgrouphead"><span>${layerLbl[k]}</span><b>${sub} / ${idxs.reduce((a,i)=>a+DATAPOINTS.cats[i].n,0)}</b></div><div class="checkitems">${idxs.map(i=>{const c=DATAPOINTS.cats[i];return `<div class="checkitem ${wizSel.has(i)?"on":""}" onclick="wizTog(${i})"><span class="checkbox"></span><span class="ci-name">${tt(c.name)}<small>${c.n} data points</small></span></div>`;}).join("")}</div></div>`;
    });

    h+=`<div class="btnrow"><button class="btn ghost" onclick="wizGo(1)">${T.wiz_back}</button><button class="btn primary" ${total?"":"disabled"} onclick="wizGo(3)">${T.wiz_next2}</button></div>`;
  } else if(wizStep===3){
    let total=0,cats=0; wizSel.forEach(i=>{total+=DATAPOINTS.cats[i].n;cats++;});
    const m=MARKETS[wizCountry];
    h+=`<div class="sumcard"><div class="sumrow"><span class="sk">${T.sum_country}</span><span class="sv">${m.flag} ${m.name}</span></div><div class="sumrow"><span class="sk">${T.lbl_city}</span><span class="sv">${wizCity}</span></div><div class="sumrow"><span class="sk">${T.sum_area}</span><span class="sv">250 m · <b>~${fmt(wizCount!=null?wizCount:wizVenuesEstimate())}</b> ${T.venues_word}</span></div><div class="sumrow"><span class="sk">${T.sum_cats}</span><span class="sv">${cats} / 21</span></div><div class="sumrow"><span class="sk">${T.sum_points}</span><span class="sv"><b>${total}</b></span></div></div>`;
    if(wizSubmitError) h+=`<div class="note" style="border-left-color:var(--coke)">${LANG==="en"?"Couldn't send the request — please try again.":"Não foi possível enviar o pedido — tenta novamente."}</div>`;
    h+=`<div class="btnrow"><button class="btn ghost" onclick="wizGo(2)">${T.wiz_back}</button><button class="btn primary" onclick="wizSubmit()">${T.wiz_submit}</button></div>`;
  }
  h+=`</div>`;
  wrap.innerHTML=h;
  if(wizStep===1) setupWizMap();
}
function clearPointLayers(){ wizPointLayers.forEach(l=>{ try{wizMap.removeLayer(l);}catch(e){} }); wizPointLayers=[]; }
function plotPoints(points){
  clearPointLayers();
  (points||[]).forEach(p=>{
    if(p.lat==null||p.lng==null) return;
    const dot=L.circleMarker([p.lat,p.lng],{radius:4,color:"#4fd6ff",weight:1,fillColor:"#4fd6ff",fillOpacity:.85}).bindTooltip(p.name||"",{direction:"top",offset:[0,-4]});
    dot.addTo(wizMap); wizPointLayers.push(dot);
  });
}
function updateCountUI(){
  const v=$("rdVenues"); if(!v) return;
  if(wizCountLoading){ v.textContent=LANG==="en"?"Counting…":"A contar…"; v.classList.add("loading"); return; }
  v.classList.remove("loading");
  v.textContent = wizCount==null ? "—" : "~"+fmt(wizCount);
}
async function fetchVenueCount(lat,lng){
  wizCountLoading=true; wizCount=null; updateCountUI();
  if(!REAL_DATA_COUNTRIES.has(wizCountry)){ wizCount=wizVenuesEstimate(); wizCountReal=false; wizCountLoading=false; updateCountUI(); if(wizMap)clearPointLayers(); return; }
  try{
    const cc=wizCountry.toLowerCase();
    const res=await fetch(`/api/venues?country=${cc}&lat=${lat}&lng=${lng}&radius=250`);
    const data=await res.json();
    if(data && data.ok){ wizCount=data.venues; wizCountReal=true; plotPoints(data.points); }
    else { wizCount=wizVenuesEstimate(); wizCountReal=false; if(wizMap)clearPointLayers(); }
  }catch(e){ wizCount=wizVenuesEstimate(); wizCountReal=false; if(wizMap)clearPointLayers(); }
  wizCountLoading=false; updateCountUI();
}
function setupWizMap(){
  const el=$("wizmap"); if(!el) return;
  if(typeof L==="undefined"){ el.innerHTML=`<div class="mapfallback">${T.map_fallback}</div>`; return; }
  if(wizMap){ try{wizMap.remove();}catch(e){} wizMap=null; wizMarker=null; wizCircle=null; }
  wizPointLayers=[];
  const c=CITYXY[wizCity]||CITYXY[MARKETS[wizCountry].cities[0]]||[38.72,-9.14];
  wizMap=L.map(el,{scrollWheelZoom:true,zoomControl:true}).setView(c,15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(wizMap);
  wizMap.on("click",e=>placeWizPin(e.latlng,false));
  setTimeout(()=>{ try{
    wizMap.invalidateSize();
    const tp=el.querySelector(".leaflet-tile-pane");
    if(tp) tp.style.filter="invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9)";
  }catch(e){} },60);
  if(wizPin){ placeWizPin(L.latLng(wizPin.lat,wizPin.lng),true); }
}
function placeWizPin(latlng,restore){
  wizPin={lat:latlng.lat,lng:latlng.lng};
  const nb=$("wizNext"); if(nb){ nb.disabled=false; nb.textContent=T.wiz_next1; }
  if(wizMap&&typeof L!=="undefined"){
    if(wizCircle)wizMap.removeLayer(wizCircle); if(wizMarker)wizMap.removeLayer(wizMarker);
    wizCircle=L.circle(latlng,{radius:250,color:"#f5001d",weight:1.5,fillColor:"#f5001d",fillOpacity:.08}).addTo(wizMap);
    wizMarker=L.circleMarker(latlng,{radius:6,color:"#e8ff4f",fillColor:"#e8ff4f",fillOpacity:1,weight:2}).addTo(wizMap);
    if(!restore)wizMap.panTo(latlng);
  }
  fetchVenueCount(latlng.lat,latlng.lng);
}
function wizGo(s){ if(s!==1&&wizMap){try{wizMap.remove();}catch(e){}wizMap=null;wizMarker=null;wizCircle=null;} wizStep=s; renderPilot(); }
function wizSetCountry(c){ wizCountry=c; wizCity=MARKETS[c].cities[0]; wizPin=null; wizCount=null; renderPilot(); }
function wizSetCity(v){ wizCity=v; wizPin=null; wizCount=null; renderPilot(); }
function wizTog(i){ if(wizSel.has(i))wizSel.delete(i); else wizSel.add(i); renderPilot(); }
function wizAll(){ DATAPOINTS.cats.forEach((c,i)=>wizSel.add(i)); renderPilot(); }
function wizClear(){ wizSel.clear(); renderPilot(); }
async function wizSubmit(){
  wizSubmitError=false; wizStep="submitting"; renderPilot();
  const m=MARKETS[wizCountry];
  let total=0,cats=0; wizSel.forEach(i=>{total+=DATAPOINTS.cats[i].n;cats++;});
  const selectedFields=[...wizSel].map(i=>DATAPOINTS.cats[i].name.en);
  const payload={
    project:"coca-cola-on-trade", country:wizCountry, countryName:m.name, city:wizCity,
    lat:wizPin?wizPin.lat:null, lng:wizPin?wizPin.lng:null, radius:250,
    venueCount:wizCount!=null?wizCount:wizVenuesEstimate(), venueCountSource:wizCountReal?"real":"estimate",
    dataPointsTotal:total, dataPointsCategories:cats, selectedFields, lang:LANG
  };
  try{
    const res=await fetch("/api/submit-pilot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await res.json();
    if(data && data.ok){ wizSentRef=data.reference; wizStep="sent"; }
    else { wizSubmitError=true; wizStep=3; }
  }catch(e){ wizSubmitError=true; wizStep=3; }
  renderPilot();
}
function wizReset(){ wizStep=1; wizPin=null; wizCount=null; wizSentRef=null; wizSubmitError=false; renderPilot(); }

/* ================= WIRING + INIT ================= */
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>applyLang(b.dataset.l));
document.querySelectorAll("#tabs .tab").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
$("mselBtn").onclick=e=>{ e.stopPropagation(); $("msel").classList.toggle("open"); };
document.addEventListener("click",e=>{ if(!$("msel").contains(e.target)) $("msel").classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("msel").classList.remove("open"); });

applyLang("en");
</script>
